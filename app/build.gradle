apply plugin: 'com.android.application'

android {
    compileSdk 37
    namespace 'com.lcodecore.twinklingrefreshlayout'
    defaultConfig {
        applicationId 'com.lcodecore.twinklingrefreshlayout'
        minSdkVersion 23
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    productFlavors {
    }
    lintOptions {
        abortOnError false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    // migrated to AndroidX / Material
    implementation libs.material
    implementation project(':library')
    implementation libs.androidx.appcompat
    implementation libs.androidx.cardview
    // removed ButterKnife library and annotation processor - view binding is done manually
    implementation libs.leakcanary.android
    // blockcanary is optional and pulls an analyzer dependency that isn't available in configured repos.
    // Commented out to avoid resolution errors. Re-add a compatible version or provide repository if needed.
    // implementation 'com.github.moduth:blockcanary-android:1.3.1'
}
